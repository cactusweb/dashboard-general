<div class="container">
  <csd-tag-container [label]="'Plan type'" [skeletons]="!license">
    {{ license?.type }}
  </csd-tag-container>
  <csd-tag-container
    [label]="'Renewal'"
    [skeletons]="!license"
    [disabled]="!price"
  >
    <span
      [innerHTML]="
        price ? (price | csdCurrency : license!.payment.currency) : '—'
      "
    ></span>
  </csd-tag-container>

  <csd-tag-container [label]="'Date of joining'" [skeletons]="!license">
    {{ joiningDate ? (joiningDate | date : "dd.MM.YY") : "—" }}
  </csd-tag-container>

  <csd-tag-container
    [label]="
      license?.type === LicenseTypes.TRIAL ? 'Expires date' : 'Next renewal'
    "
    [skeletons]="!license"
    [disabled]="!renewalDate"
  >
    {{ renewalDate ? (renewalDate | date : "dd.MM.YY") : "—" }}
  </csd-tag-container>
</div>
